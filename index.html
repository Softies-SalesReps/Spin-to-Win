<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Softies Spin to Win</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Q4 2026 Softies sales agency competition: goals, leaderboards, Cozy Credits and prize drawings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
/* Layout: one centered column (max 1180px) under a sticky header with scrollable pill nav;
   cards on warm ivory; display serif for big numbers, a friendly sans for everything else. */
:root {
  --bg: #FBF7F0;
  --sunken: #F4ECDF;
  --card: #FFFDF9;
  --ink: #3B2A22;
  --ink-2: #7A6458;
  --ink-3: #A08C7E;
  --line: #EADFCF;
  --berry: #993347;
  --berry-ink: #FFFFFF;
  --berry-soft: #F5E3E3;
  --gold: #B48A33;
  --gold-soft: #F6ECD5;
  --pine: #3E5F4E;
  --pine-soft: #E3EDE6;
  --almond: #D8C2A3;
  --espresso: #5B4033;
  --midnight: #33405A;
  --blush: #E4B5B2;
  --warn: #A8641B;
  --warn-soft: #F8E8D3;
  --shadow: 0 1px 2px rgba(80, 50, 30, .06), 0 8px 24px rgba(80, 50, 30, .07);
  --shadow-lg: 0 2px 4px rgba(80, 50, 30, .06), 0 18px 48px rgba(80, 50, 30, .12);
  --font-display: "Young Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1411; --sunken: #231A16; --card: #2A201B; --ink: #F3E8DA; --ink-2: #C3AF9F; --ink-3: #94806F;
    --line: #3D3029; --berry: #E07A8B; --berry-ink: #2A1418; --berry-soft: #3C232A; --gold: #DDB664; --gold-soft: #3A3020;
    --pine: #8FBEA3; --pine-soft: #213029; --almond: #BFA584; --espresso: #A8836E; --midnight: #8DA0C6; --blush: #D9A3A0;
    --warn: #E5A55A; --warn-soft: #3A2B1A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.35), 0 18px 48px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1411; --sunken: #231A16; --card: #2A201B; --ink: #F3E8DA; --ink-2: #C3AF9F; --ink-3: #94806F;
  --line: #3D3029; --berry: #E07A8B; --berry-ink: #2A1418; --berry-soft: #3C232A; --gold: #DDB664; --gold-soft: #3A3020;
  --pine: #8FBEA3; --pine-soft: #213029; --almond: #BFA584; --espresso: #A8836E; --midnight: #8DA0C6; --blush: #D9A3A0;
  --warn: #E5A55A; --warn-soft: #3A2B1A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.35), 0 18px 48px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: -.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.proto-strip {
  background: var(--gold-soft); color: var(--ink); font-size: 12.5px;
  padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; justify-content: center; text-align: center;
}
.proto-strip b { font-weight: 700; }
.proto-strip .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1180px; margin: 0 auto;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 11px; margin-right: auto; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--berry) 0 25%, var(--gold) 0 50%, var(--pine) 0 75%, var(--almond) 0);
  position: relative; box-shadow: inset 0 0 0 3px var(--card);
}
.brand-mark::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--card); }
.brand-name { font-family: var(--font-display); font-size: 22px; line-height: 1.05; }
.brand-name span { color: var(--berry); }
.brand-tag { font-size: 12px; color: var(--ink-2); }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; background: var(--sunken); color: var(--ink); border: 1px solid var(--line); white-space: nowrap;
}
.chip svg { width: 14px; height: 14px; }
.chip.berry { background: var(--berry-soft); color: var(--berry); border-color: transparent; }
.chip.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.chip.pine { background: var(--pine-soft); color: var(--pine); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.btn-text { background: none; border: 0; padding: 4px 6px; color: var(--ink-2); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; padding-bottom: 0; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 14px 12px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14.5px;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.tabs a svg { width: 16px; height: 16px; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--berry); border-bottom-color: var(--berry); }
nav.tabs a.locked { opacity: .75; }

main {
  max-width: 1180px; margin: 0 auto;
  padding-block: 22px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
main > * { min-width: 0; }

/* ---------- Cards & grids ---------- */
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.sunken { background: var(--sunken); box-shadow: none; }
.card-head { display: flex; align-items: baseline; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h2, .card-head h3 { margin-right: auto; }
h2.section { font-family: var(--font-display); font-size: 24px; font-weight: 400; }
h3.sub { font-size: 16px; font-weight: 700; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.split { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Agency switcher ---------- */
.switcher { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.switcher button {
  flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px 7px 8px;
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; color: var(--ink);
}
.switcher button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mini-ring { --p: 0; width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--berry) calc(var(--p) * 1%), var(--line) 0); position: relative; }
.mini-ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
.switcher button[aria-pressed="true"] .mini-ring::after { background: var(--ink); }
.scope-note { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.scope-note svg { width: 15px; height: 15px; flex: none; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; padding: 28px; }
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, var(--gold-soft) 0 55%, transparent 56%);
  opacity: .8; pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
@media (max-width: 620px) { .hero::after { width: 150px; height: 150px; right: -50px; top: -50px; opacity: .55; } }
.hero-top { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 5vw, 50px); line-height: 1.02; margin-top: 6px; }
.goal-line { font-size: 15px; color: var(--ink-2); margin-top: 6px; }
.goal-line b { color: var(--ink); }
.big-written { text-align: right; }
.big-written .val { font-family: var(--font-display); font-size: clamp(36px, 6vw, 58px); line-height: 1; color: var(--berry); }
@media (max-width: 620px) { .big-written { text-align: left; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--sunken); border-radius: var(--r-md); padding: 14px 16px; min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.stat .v { font-family: var(--font-display); font-size: 27px; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--ink-2); }

/* ---------- Progress ribbon ---------- */
.ribbon-wrap { margin-top: 26px; padding-top: 30px; }
.ribbon { position: relative; height: 30px; border-radius: 999px; background: var(--sunken); box-shadow: inset 0 1px 3px rgba(60, 40, 30, .12); }
.ribbon-fill {
  position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--berry), color-mix(in srgb, var(--berry) 55%, var(--gold)) 70%, var(--gold));
  transition: width 1.6s cubic-bezier(.2, .8, .2, 1);
  min-width: 30px;
}
.ribbon-fill::after { /* stitching */
  content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 0;
  border-top: 2px dashed rgba(255, 255, 255, .55); transform: translateY(-50%);
}
.ribbon-fill.zero { min-width: 0; }
.ribbon-fill.zero::after { display: none; }
.ms { position: absolute; top: -30px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.ms .tag {
  padding: 2px 8px 2px 12px; border-radius: 4px 8px 8px 4px; background: var(--card); border: 1px solid var(--line); position: relative; white-space: nowrap;
}
.ms .tag::before { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--line); transform: translateY(-50%); }
.ms.hit { color: var(--berry); }
.ms.hit .tag { border-color: var(--berry); background: var(--berry-soft); }
.ms.hit .tag::before { background: var(--berry); }
.ms .pin { width: 2px; height: 38px; background: var(--line); margin-top: -2px; }
.ms.hit .pin { background: color-mix(in srgb, var(--berry) 40%, transparent); }
.ms:last-child { transform: translateX(-100%); align-items: flex-end; }
.ms:last-child .pin { margin-right: 4px; }
.ribbon-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-2); }

.milestone-note { display: flex; gap: 14px; align-items: center; border-radius: var(--r-md); padding: 14px 16px; margin-top: 18px; background: var(--pine-soft); color: var(--ink); }
.milestone-note svg { width: 26px; height: 26px; flex: none; color: var(--pine); }
.milestone-note b { color: var(--pine); }

.crushed {
  margin-top: 20px; border-radius: var(--r-lg); padding: 26px; text-align: center; position: relative; overflow: hidden;
  background: radial-gradient(120% 140% at 50% 0%, var(--gold-soft), var(--berry-soft));
}
.crushed .big { font-family: var(--font-display); font-size: clamp(30px, 6vw, 48px); line-height: 1.05; color: var(--berry); }
.crushed p { margin-top: 8px; font-size: 16px; }
.crushed .names { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }

/* ---------- Lists ---------- */
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.kv:first-child { border-top: 0; }
.feed { display: grid; gap: 0; }
.feed-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.feed-row:first-child { border-top: 0; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--sunken); color: var(--ink); border: 1px solid var(--line); flex: none;
}
.feed-row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row .m { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row .r { text-align: right; }

/* ---------- Hang-tag ticket ---------- */
.ticket {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 16px; position: relative;
  background: var(--gold-soft); color: var(--ink); font-weight: 700; font-size: 13px; border-radius: 4px 999px 999px 4px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.ticket::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--card); transform: translateY(-50%); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 50%, transparent); }
.ticket.lg { font-size: 16px; padding: 6px 14px 6px 22px; }
.ticket.lg::before { left: 8px; width: 7px; height: 7px; }
.ticket.zero { background: var(--sunken); color: var(--ink-3); }
.bonus { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.bonus.base { background: var(--sunken); color: var(--ink); }
.bonus.t1, .bonus.t2 { background: var(--gold-soft); color: var(--gold); }
.bonus.new { background: var(--berry-soft); color: var(--berry); }
.bonus.react { background: var(--pine-soft); color: var(--pine); }
.bonus.power { background: color-mix(in srgb, var(--midnight) 16%, transparent); color: var(--midnight); }
.bonus.review { background: var(--warn-soft); color: var(--warn); }
.bonus.none { background: transparent; color: var(--ink-3); border: 1px dashed var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------- Segmented & buttons ---------- */
.seg { display: inline-flex; background: var(--sunken); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px;
  padding: 11px 20px; font-weight: 700; font-size: 14.5px; background: var(--berry); color: var(--berry-ink);
  box-shadow: 0 2px 0 color-mix(in srgb, var(--berry) 60%, #000); transition: transform .12s ease, filter .12s;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 17px; height: 17px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn.gold { background: var(--gold); color: #fff; box-shadow: 0 2px 0 color-mix(in srgb, var(--gold) 60%, #000); }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 0 -6px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t td.c, table.t th.c { text-align: center; }
table.t tr.me td { background: var(--gold-soft); }
.rank { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 800; font-size: 14px; background: var(--sunken); }
.rank.r1 { background: var(--gold); color: #fff; }
.rank.r2 { background: color-mix(in srgb, var(--almond) 45%, var(--card)); color: var(--ink); }
.rank.r3 { background: var(--berry-soft); color: var(--berry); }
.rank svg { width: 18px; height: 18px; }
.rep-cell { display: flex; align-items: center; gap: 10px; min-width: 170px; }
.rep-cell .nm { font-weight: 700; }
.badges { display: inline-flex; gap: 4px; }
.badge-ic { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; }
.badge-ic svg { width: 13px; height: 13px; }
.badge-ic.gold { background: var(--gold-soft); color: var(--gold); }
.badge-ic.berry { background: var(--berry-soft); color: var(--berry); }
.badge-ic.pine { background: var(--pine-soft); color: var(--pine); }
.badge-ic.mid { background: color-mix(in srgb, var(--midnight) 16%, transparent); color: var(--midnight); }
.bar { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; min-width: 70px; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--berry); }
.bar.gold > i { background: var(--gold); }
.bar.pine > i { background: var(--pine); }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Rep accordions ---------- */
details.rep { border-top: 1px solid var(--line); }
details.rep:first-of-type { border-top: 0; }
details.rep summary {
  list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 14px 4px; cursor: pointer;
}
details.rep summary::-webkit-details-marker { display: none; }
details.rep summary .chev { width: 18px; height: 18px; color: var(--ink-3); transition: transform .2s; }
details.rep[open] summary .chev { transform: rotate(90deg); }
details.rep .body { padding: 0 4px 18px; }
@media (max-width: 560px) { details.rep summary { grid-template-columns: minmax(0, 1fr) auto auto; } details.rep summary .avatar { display: none; } }

/* ---------- Calculator ---------- */
.rules { display: grid; gap: 8px; margin: 14px 0; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; background: var(--sunken); border-radius: var(--r-sm); }

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
const FULFIL_SQL = "WITH comp AS (\n  SELECT id, order_number, order_reference, channel_identifier, order_date, state, customer_id, customer_name,\n    sales_person_name, shipment_address_line1, shipment_address_zip, shipment_address_city, shipment_region_code, lines\n  FROM sales_orders\n  WHERE channel_name LIKE '%MarketTime%' AND order_date BETWEEN '2026-10-15' AND '2026-12-15'\n), hist AS (\n  SELECT customer_id, order_date, LOWER(TRIM(shipment_address_line1)) a1, SUBSTR(shipment_address_zip,1,5) z\n  FROM sales_orders\n  WHERE state NOT IN ('cancel','failed','ignored')\n    AND (SELECT SUM(l.amount) FROM UNNEST(lines) l) > 0\n    AND (customer_id IN (SELECT customer_id FROM comp)\n      OR CONCAT(LOWER(TRIM(shipment_address_line1)),'|',SUBSTR(shipment_address_zip,1,5)) IN (SELECT CONCAT(LOWER(TRIM(shipment_address_line1)),'|',SUBSTR(shipment_address_zip,1,5)) FROM comp))\n)\nSELECT c.id, c.order_number AS so, c.order_reference AS po, c.channel_identifier AS mt, CAST(c.order_date AS STRING) AS d,\n  c.state AS st, c.customer_id AS cid, c.customer_name AS cust, c.sales_person_name AS rep,\n  CONCAT(IFNULL(c.shipment_address_city,''), IF(c.shipment_region_code IS NULL,'',CONCAT(', ',c.shipment_region_code))) AS loc,\n  (SELECT IFNULL(SUM(l.amount),0) FROM UNNEST(c.lines) l WHERE IFNULL(l.product_code,'') != 'SHIPPING' AND NOT REGEXP_CONTAINS(LOWER(IFNULL(l.product_code,'')), r'fee')) AS merch,\n  (SELECT IFNULL(SUM(l.amount),0) FROM UNNEST(c.lines) l WHERE l.product_code = 'SHIPPING' OR REGEXP_CONTAINS(LOWER(IFNULL(l.product_code,'')), r'fee')) AS ship,\n  (SELECT COUNT(*) FROM UNNEST(c.lines) l WHERE STARTS_WITH(IFNULL(l.product_code,''), '7800-20') AND l.quantity > 0) AS pw,\n  (SELECT SUBSTR(TO_HEX(MD5(STRING_AGG(CONCAT(IFNULL(l.product_code,''),':',CAST(l.quantity AS STRING),':',CAST(l.amount AS STRING)), ',' ORDER BY l.product_code, l.quantity))),1,10) FROM UNNEST(c.lines) l) AS sig,\n  (SELECT CAST(MAX(h.order_date) AS STRING) FROM hist h WHERE h.customer_id = c.customer_id AND h.order_date < c.order_date) AS lp,\n  (SELECT COUNT(*) FROM hist h WHERE h.customer_id = c.customer_id AND h.order_date < c.order_date) AS np,\n  (SELECT COUNT(*) FROM hist h WHERE h.customer_id != c.customer_id AND h.a1 = LOWER(TRIM(c.shipment_address_line1)) AND h.z = SUBSTR(c.shipment_address_zip,1,5) AND h.order_date < c.order_date) AS am\nFROM comp c ORDER BY c.order_date, c.id\n";
/* ============================================================
   Competition engine — pure functions, no DOM.
   Everything shown in the app is recalculated from raw Fulfil
   rows + admin settings every time this runs.
   ============================================================ */
const CONFIG = {
  title: "Softies Spin to Win",
  tagline: "Every Order Counts. Every Rep Can Win.",
  start: "2026-10-15",
  end: "2026-12-15",
  channel: "MarketTime",
  giftCard: 100,
  grandPrize: 3000,
  powerSku: "7800-20",
  dormantBefore: "2026-01-01",
  agencies: [
    { id: "fine-lines", name: "Fine Lines",     goal: 215000, match: /fine\s*lines?/i },
    { id: "harper",     name: "Harper Group",   goal: 260000, match: /harper/i },
    { id: "patrick",    name: "Patrick & Co.",  goal: 150000, match: /patrick/i },
    { id: "schauben",   name: "Schauben & Co.", goal: 300000, match: /schauben/i },
    { id: "portico",    name: "Portico",        goal: 30000,  match: /portico/i },
    { id: "ivystone",   name: "Ivystone",       goal: 150000, match: /ivystone/i }
  ],
  nonParticipating: [/^\s*DYA\s*$/i],
  draws: [
    // Round 1 extended from Oct 30 to Nov 6 (orders written Oct 15 – Nov 6)
    { id: "oct", date: "2026-11-06", prize: 500,  name: "First Drawing" },
    { id: "nov", date: "2026-11-30", prize: 750,  name: "Second Drawing" }, // moved from Nov 20 to Nov 30
    { id: "dec", date: "2026-12-15", prize: 1000, name: "Final Drawing" }
  ],
  credit: { min: 500, tier1: 2500, tier1Bonus: 2, tier2: 5000, tier2Bonus: 5, newBonus: 5, dormantBonus: 3, powerBonus: 2 },
  excludedStates: ["cancel", "failed", "ignored"],
  milestones: [25, 50, 75, 100]
};
CONFIG.nationalGoal = CONFIG.agencies.reduce((s, a) => s + a.goal, 0);

const Engine = (() => {
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

  function cleanName(s) {
    if (!s) return "";
    s = String(s).replace(/\s+/g, " ").trim();
    if (s === s.toUpperCase() && /[A-Z]/.test(s)) {
      s = s.toLowerCase().replace(/(^|[\s'’\-.])([a-z])/g, (m, a, b) => a + b.toUpperCase());
    }
    return s;
  }

  function parseRep(raw) {
    if (!raw || !String(raw).trim()) return { name: "", suffix: null };
    const parts = String(raw).split(/\s+[-–]\s*/).map(p => p.trim()).filter(Boolean);
    if (parts.length > 1) return { name: cleanName(parts.slice(0, -1).join(" - ")), suffix: parts[parts.length - 1] };
    return { name: cleanName(raw), suffix: null };
  }

  const agencyById = id => CONFIG.agencies.find(a => a.id === id) || null;

  function matchAgency(text) {
    if (!text) return null;
    if (CONFIG.nonParticipating.some(rx => rx.test(text))) return "np";
    const a = CONFIG.agencies.find(a => a.match.test(text));
    return a ? a.id : null;
  }

  /* Who wrote it, and for which agency? Admin overrides win. */
  function attribute(row, settings) {
    const ov = settings.orderAssign && settings.orderAssign[row.id];
    if (ov && ov.agency) return { status: ov.agency === "np" ? "np" : "ok", agencyId: ov.agency, rep: cleanName(ov.rep || parseRep(row.rep).name || "Unassigned"), how: "admin" };
    const p = parseRep(row.rep);
    if (!p.name) return { status: "needs-rep", agencyId: null, rep: "", how: null };
    const bySuffix = matchAgency(p.suffix);
    if (bySuffix === "np") return { status: "np", agencyId: null, rep: p.name, how: "name" };
    if (bySuffix) return { status: "ok", agencyId: bySuffix, rep: p.name, how: "name" };
    const fullName = p.suffix ? cleanName(row.rep) : p.name;
    const mapped = settings.repAgency && settings.repAgency[fullName];
    if (mapped === "np") return { status: "np", agencyId: null, rep: fullName, how: "admin" };
    if (mapped) return { status: "ok", agencyId: mapped, rep: fullName, how: "admin" };
    return { status: "needs-agency", agencyId: null, rep: fullName, how: null };
  }

  function creditsFor(amount, flags) {
    const c = CONFIG.credit, parts = [];
    if (amount < c.min) return { total: 0, parts };
    parts.push({ key: "base", label: "Qualifying order $500+", n: 1 });
    if (amount >= c.tier1) parts.push({ key: "t1", label: "$2,500+ order", n: c.tier1Bonus });
    if (amount >= c.tier2) parts.push({ key: "t2", label: "$5,000+ order", n: c.tier2Bonus });
    if (flags.isNew) parts.push({ key: "new", label: "New account", n: c.newBonus });
    if (flags.dormant) parts.push({ key: "react", label: "Reactivated account", n: c.dormantBonus });
    if (flags.power) parts.push({ key: "power", label: "Power SKU " + CONFIG.powerSku, n: c.powerBonus });
    return { total: parts.reduce((s, p) => s + p.n, 0), parts };
  }

  const normPO = po => (po || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

  /* Main pass. opts.asOf limits to orders written on/before that date. */
  function compute(rawRows, settings, opts) {
    settings = settings || {};
    opts = opts || {};
    const asOf = opts.asOf || null;
    const excluded = [], queue = [], candidates = [];

    for (const raw of rawRows) {
      const r = {
        id: raw.id, so: raw.so || "Draft #" + raw.id, po: raw.po || "", mt: raw.mt, d: raw.d, st: raw.st,
        cid: raw.cid, cust: (raw.cust || "").trim(), rep: raw.rep, loc: raw.loc || "",
        merch: num(raw.merch), ship: num(raw.ship), pw: num(raw.pw) > 0, sig: raw.sig || String(raw.id),
        lp: raw.lp || null, np: num(raw.np), am: num(raw.am)
      };
      if (asOf && r.d > asOf) continue;
      const ex = reason => excluded.push(Object.assign({}, r, { reason }));
      if (CONFIG.excludedStates.includes(r.st)) { ex("Canceled in Fulfil"); continue; }
      if (r.d < CONFIG.start || r.d > CONFIG.end) { ex("Written outside Oct 15 – Dec 15"); continue; }
      if (r.merch < 0) { ex("Return or credit (not new sales)"); continue; }
      if (r.merch === 0) { ex("$0 order"); continue; }
      const who = attribute(r, settings);
      r.who = who;
      if (who.status === "np") { ex("Agency not in this competition"); continue; }
      const squash = t => (t || "").toLowerCase().replace(/[^a-z]/g, "");
      if (who.status === "ok" && who.how !== "admin" && who.rep && squash(r.cust).includes(squash(who.rep))) { ex("Rep's own account (sample/personal order)"); continue; }
      if (who.status !== "ok") {
        queue.push(r);
        ex(who.status === "needs-rep" ? "Waiting on admin: no rep on order" : "Waiting on admin: rep has no agency");
        continue;
      }
      candidates.push(r);
    }

    // One customer PO = one entry. Identical records = duplicates; different records = a split order.
    const groups = new Map();
    for (const r of candidates.sort((a, b) => a.d.localeCompare(b.d) || a.id - b.id)) {
      const key = r.cid + "|" + (normPO(r.po) || "SO" + r.id);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const entries = [];
    const acctBonus = new Set(); // new/reactivated bonus counts once per customer (earliest PO)
    for (const [key, recs] of groups) {
      const seen = new Map(), kept = [];
      for (const r of recs) {
        const dupKey = r.sig + "|" + r.merch;
        if (seen.has(dupKey)) { excluded.push(Object.assign({}, r, { reason: "Duplicate of " + seen.get(dupKey).so })); continue; }
        seen.set(dupKey, r); kept.push(r);
      }
      const first = kept[0];
      const amount = kept.reduce((s, r) => s + r.merch, 0);
      let newStatus = null, isNew = false;
      const bonusFree = !acctBonus.has(first.cid);
      acctBonus.add(first.cid);
      if (first.np === 0 && bonusFree) {
        const rv = settings.newReview && settings.newReview[first.cid];
        if (first.am > 0) newStatus = rv === "approved" ? "approved" : rv === "denied" ? "denied" : "review";
        else newStatus = rv === "denied" ? "denied" : "new";
        isNew = newStatus === "new" || newStatus === "approved";
      }
      const dormant = bonusFree && first.np > 0 && !!first.lp && first.lp < CONFIG.dormantBefore;
      const power = kept.some(r => r.pw);
      const cr = creditsFor(amount, { isNew, dormant, power });
      const drawIdx = CONFIG.draws.findIndex(dw => first.d <= dw.date);
      entries.push({
        key, agencyId: first.who.agencyId, rep: first.who.rep, repKey: first.who.agencyId + "::" + first.who.rep,
        cid: first.cid, cust: first.cust, loc: first.loc, po: first.po, date: first.d,
        records: kept.map(r => ({ id: r.id, so: r.so, amount: r.merch, st: r.st })), split: kept.length > 1,
        amount, isNew, newStatus, dormant, lastPrior: first.lp, power, credits: cr.total, parts: cr.parts,
        firstDraw: drawIdx, pending: kept.some(r => r.st === "draft")
      });
    }
    entries.sort((a, b) => a.date.localeCompare(b.date) || b.amount - a.amount);

    // Roll up reps and agencies
    const reps = new Map();
    for (const e of entries) {
      if (!reps.has(e.repKey)) reps.set(e.repKey, { key: e.repKey, name: e.rep, agencyId: e.agencyId, sales: 0, orders: 0, creditOrders: 0, newAcc: 0, react: 0, power: 0, credits: 0, entries: [], lastDate: "" });
      const r = reps.get(e.repKey);
      r.sales += e.amount; r.orders += 1; r.credits += e.credits;
      if (e.credits > 0) r.creditOrders += 1;
      if (e.isNew) r.newAcc += 1;
      if (e.dormant) r.react += 1;
      if (e.power) r.power += 1;
      r.entries.push(e);
      if (e.date > r.lastDate) r.lastDate = e.date;
    }
    const agencies = CONFIG.agencies.map(a => {
      const list = [...reps.values()].filter(r => r.agencyId === a.id);
      const sales = list.reduce((s, r) => s + r.sales, 0);
      list.forEach(r => { r.contribution = a.goal ? r.sales / a.goal : 0; });
      return {
        id: a.id, name: a.name, goal: a.goal, sales,
        orders: list.reduce((s, r) => s + r.orders, 0),
        credits: list.reduce((s, r) => s + r.credits, 0),
        newAcc: list.reduce((s, r) => s + r.newAcc, 0),

/* ---------- Agency access (encrypted) ----------
   Each agency's numbers are packed into this page encrypted with that agency's own access code
   (PBKDF2-SHA256 key + AES-GCM). The codes themselves are never in the page, so one agency's
   code cannot open another agency's numbers. Softies admins work from the live shared store. */
let VAULT = null;

  return JSON.parse(await new Response(stream).text());

  const c = $("#confetti"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);

  for (let i = 0; i < N; i++) parts.push({
    x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .5, y: innerHeight * .35 + (Math.random() - .5) * 60,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, a: Math.random() * 6.3,
    va: (Math.random() - .5) * .3, col: colors[i % colors.length], shape: i % 3

  (function frame(t) {
    const dt = Math.min(32, t - t0) / 16; t0 = t;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = 0;
    for (const p of parts) {
      p.vy += .32 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
      if (p.y < innerHeight + 20) alive++;

}

/* Agency sign-ins get a focused three-tab version; admins see every tab. */
const visibleRoutes = () => isAdmin() ? ROUTES : ROUTES.filter(r => r.agency);
function readHash() {
  const h = (location.hash || "").replace(/^#/, "");
  state.route = ROUTES.some(r => r.id === h) ? h : "my-agency";
}

function goRoute(r) { if (location.hash === "#" + r) { readHash(); render(); window.scrollTo(0, 0); } else location.hash = r; }

/* ---------- Shell ---------- */
function renderShell() {
  const s = state.session;
  const app = $("#app");
  if (!s) { app.innerHTML = renderSignIn(); bindSignIn(); return false; }
  const agName = s.role === "admin" ? "Softies Admin" : Engine.agencyById(s.agencyId).name;
  const admin = s.role === "admin";
  const asOf = admin ? state.dataMeta.refreshedAt : (state.payload && state.payload.dataAsOf);
  const storeChip = !admin ? "" : Store.mode === "shared"
    ? `<span class="chip pine" title="Drawings and admin fixes are shared with everyone who opens this page">${I.database} Shared results</span>`
    : `<span class="chip warn" title="Drawings and admin fixes are saved in this browser only">${I.database} Demo storage</span>`;
  app.innerHTML = `
    <div class="proto-strip" role="note">
      <span>${asOf ? `Fulfil data as of <b>${esc(fmtStamp(asOf))}</b>` : "Loading Fulfil data…"}</span><i class="dot"></i>
      <span>Updates every morning and afternoon</span>
      ${state.previewDate ? `<i class="dot"></i><span><b>Previewing ${esc(fmtDate(state.previewDate, { year: "numeric" }))}</b></span>` : ""}
    </div>
    <header class="top">
      <div class="top-inner">
        <div class="brand-row">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true"></div>
            <div style="min-width:0">
              <div class="brand-name">Softies <span>Spin to Win</span></div>
              <div class="brand-tag">${esc(CONFIG.tagline)}</div>
            </div>
          </div>
          <div class="who">
            <span class="chip ${s.role === "admin" ? "berry" : "gold"}">${s.role === "admin" ? I.shield : I.users} ${esc(agName)}</span>
            ${storeChip}
            <button class="btn-text" data-action="signout">Sign out</button>
          </div>
        </div>
        <nav class="tabs" aria-label="Sections">
          ${visibleRoutes().map(r => `<a href="#${r.id}" ${state.route === r.id ? 'aria-current="page"' : ""} class="${r.id === "admin" && !isAdmin() ? "locked" : ""}">${I[r.icon]}${esc(r.label)}${r.id === "admin" && isAdmin() && adminQueueCount() ? ` <span class="count">${adminQueueCount()}</span>` : ""}</a>`).join("")}
        </nav>
      </div>
    </header>
    <main id="view"></main>`;
  return true;
}

function adminQueueCount() {
  if (!state.result) return 0;
  const reps = new Set(state.result.queue.filter(r => r.who.status === "needs-agency").map(r => r.who.rep));
  const noRep = state.result.queue.filter(r => r.who.status === "needs-rep").length;
  const reviews = state.result.entries.filter(e => e.newStatus === "review").length;
  return reps.size + noRep + reviews;
}

function render() {
  if (!renderShell()) return;
  if (!visibleRoutes().some(r => r.id === state.route)) { state.route = "my-agency"; history.replaceState(null, "", "#my-agency"); return render(); }
  const sc = scope();
  const view = $("#view");
  if (!sc) { view.innerHTML = `<div class="card empty">Your session couldn't be matched to an agency. Please sign out and sign in again.</div>`; return; }
  const fn = { "my-agency": viewAgency, "leaderboard": viewLeaderboard, "cozy-credits": viewCredits, "prize-drawings": viewDrawings, "spotlight": viewSpotlight, "admin": viewAdmin }[state.route];
  view.innerHTML = fn(sc);
  afterRender(sc);
}

const WHEEL_TOKENS = ["--berry", "--gold", "--pine", "--almond", "--midnight", "--blush", "--espresso", "--warn"];
// n = number of slices; keeps the last slice from matching the first one it touches
function wheelColor(i, n) {
  const L = WHEEL_TOKENS.length;
  let k = i % L; if (n > 1 && i === n - 1 && k === 0) k = 2;
  return getComputedStyle(document.documentElement).getPropertyValue(WHEEL_TOKENS[k]).trim() || "#999";
}

function drawWheel(pool, angle) {
  const cv = $("#wheel"); if (!cv) return;
  const box = cv.parentElement.getBoundingClientRect();
  const size = Math.max(200, Math.floor(box.width)), dpr = window.devicePixelRatio || 1;
  if (cv.width !== size * dpr) { cv.width = size * dpr; cv.height = size * dpr; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2, R = size / 2 - 10;
  const cs = getComputedStyle(document.documentElement);
  const card = cs.getPropertyValue("--card").trim(), ink = cs.getPropertyValue("--ink").trim(), line = cs.getPropertyValue("--line").trim();
  const total = pool.reduce((s, p) => s + p.credits, 0);
  // rim
  ctx.beginPath(); ctx.arc(cx, cy, R + 7, 0, Math.PI * 2); ctx.fillStyle = ink; ctx.fill();
  let a0 = angle - Math.PI / 2;
  pool.forEach((p, i) => {
    const sw = p.credits / total * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + sw); ctx.closePath();
    ctx.fillStyle = wheelColor(i, pool.length); ctx.fill();
    ctx.strokeStyle = card; ctx.lineWidth = 2; ctx.stroke();
    if (sw > 0.12) {
      const mid = a0 + sw / 2, flip = Math.cos(mid) < 0;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(flip ? mid + Math.PI : mid);
      const k = (pool.length > 1 && i === pool.length - 1 && i % WHEEL_TOKENS.length === 0) ? 2 : i % WHEEL_TOKENS.length;
      ctx.fillStyle = (k === 3 || k === 5) ? "#3B2A22" : "#FFFFFF";
      const fs = Math.max(11, Math.min(16, size / 28));
      ctx.font = `700 ${fs}px Figtree, system-ui, sans-serif`; ctx.textAlign = flip ? "left" : "right"; ctx.textBaseline = "middle";
      let label = p.name; const maxW = R * .62;
      while (ctx.measureText(label).width > maxW && label.length > 4) label = label.slice(0, -2);
      if (label !== p.name) label = label.trim() + "…";
      ctx.fillText(label, flip ? -(R - 16) : R - 16, 0);
      ctx.restore();
    }
    a0 += sw;
  });
  // stud dots on rim
  for (let k = 0; k < 24; k++) { const t = k / 24 * Math.PI * 2; ctx.beginPath(); ctx.arc(cx + Math.cos(t) * (R + 3.5), cy + Math.sin(t) * (R + 3.5), 1.8, 0, 6.3); ctx.fillStyle = "rgba(255,240,210,.85)"; ctx.fill(); }
  // hub
  ctx.beginPath(); ctx.arc(cx, cy, R * .17, 0, Math.PI * 2); ctx.fillStyle = card; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke();
  ctx.fillStyle = cs.getPropertyValue("--berry").trim(); ctx.font = `400 ${Math.max(12, R * .1)}px "Young Serif", Georgia, serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Softies", cx, cy + 1);
}

function cryptoRand() { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; }

function spin() {
  if (!isAdmin() || state.wheel.spinning) return;
  const sc = scope(), a = sc.agency;
  const sel = drawStatus(a.id).find(d => d.id === state.wheel.drawId);
  if (!sel) return;
  const { pool, total } = Engine.drawPool(a, sel);
  const winner = Engine.weightedPick(pool, cryptoRand());
  if (!winner) return;
  state.wheel.pending = null;
  // Angle (wheel coordinates, 0 = pointer) of a random point inside the winner's slice
  let start = 0; for (const p of pool) { if (p.key === winner.key) break; start += p.credits / total * Math.PI * 2; }
  const sw = winner.credits / total * Math.PI * 2;
  const theta = start + sw * (0.15 + 0.7 * cryptoRand());
  const from = state.wheel.angle % (Math.PI * 2);
  let target = -theta; while (target < from) target += Math.PI * 2;
  target += Math.PI * 2 * (reduceMotion() ? 1 : 6);
  const dur = reduceMotion() ? 600 : 5600, t0 = performance.now();
  state.wheel.spinning = true;
  const btn = document.querySelector('[data-action="spin"]'); if (btn) btn.disabled = true;
  (function frame(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    state.wheel.angle = from + (target - from) * e;
    drawWheel(pool, state.wheel.angle);
    if (k < 1) requestAnimationFrame(frame);
    else {
      state.wheel.spinning = false;
      state.wheel.pending = { agencyId: a.id, drawId: sel.id, winnerKey: winner.key, winnerName: winner.name, entries: winner.credits, total, chance: winner.credits / total };
      render(); confetti(true);
    }
  })(t0);
}

async function confirmWinner() {
  const p = state.wheel.pending; if (!p || !isAdmin()) return;
  const d = CONFIG.draws.find(x => x.id === p.drawId);
  state.draws = state.draws.filter(r => !(r.agencyId === p.agencyId && r.drawId === p.drawId));
  state.draws.push(Object.assign({}, p, { prize: d.prize, date: d.date, savedAt: new Date().toISOString(), dataAsOf: state.dataMeta.refreshedAt }));
  state.wheel.pending = null;
  await Store.saveDraws();
  toast(`Saved: ${p.winnerName} wins the ${d.name} (${money(d.prize)}).`);
  render();
}

/* Backup to the daily scheduled refresh: when a Softies editor opens the admin view and the
   shared numbers are more than 12 hours old, pull from Fulfil quietly and share the result. */
function maybeAutoRefresh() {
  if (state.autoTried || !isAdmin() || !state.canEditPage) return;
  setTimeout(() => {
    const age = Date.now() - Date.parse(state.dataMeta.refreshedAt);
    if (state.autoTried || !isAdmin() || !(age > 12 * 3600 * 1000)) return;
    state.autoTried = true; refreshFromFulfil(true);
  }, 4000);
}
async function refreshFromFulfil(quiet) {
  const btn = $("#refresh-btn"); if (btn) { btn.disabled = true; btn.textContent = "Refreshing…"; }
  try {
    const mcp = await cap("mcp");
    if (!mcp) { if (!quiet) toast("Live refresh needs the Fulfil connector. Open this page in Claude while signed in to the Softies account."); return; }
    const res = await mcp.callTool("Fulfil", "query_data_warehouse", { query: FULFIL_SQL, limit: 1000 }, { cache: false });
    let p = res && res.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) {} }
    if (!p || !Array.isArray(p.results)) {
      const txt = res && res.content && res.content.find(c => c.type === "text");
      if (txt) { try { p = JSON.parse(txt.text); } catch (e) {} }
    }
    const rows = p && Array.isArray(p.results) ? p.results : null;
    if (!rows || (rows.length && !("id" in rows[0] && "d" in rows[0]))) { toast("Fulfil answered, but not in the expected shape. Nothing changed."); return; }
    state.rows = rows;
    state.dataMeta = { refreshedAt: new Date().toISOString(), source: "Live refresh from Fulfil" };
    const shared = await Store.saveOrders(rows, state.dataMeta);
    recompute(); render();
    toast(`Refreshed: ${rows.length} Fulfil records.${shared ? " Admin numbers updated; reps see them at the next scheduled update." : ""}${rows.length >= 1000 ? " Hit the 1,000-row limit; contact support to raise it." : ""}`, 5200);
  } catch (e) {
    const code = e && e.code;
    if (quiet) return;
    toast(code === "not_granted" || code === "permission_denied" ? "Fulfil access wasn't allowed for this page." :
      code === "server_not_connected" || code === "not_connected" ? "Connect Fulfil in Claude's connector settings, then try again." :
      "Couldn't reach Fulfil just now. The current numbers are unchanged.");
  } finally {
    const b = $("#refresh-btn"); if (b) { b.disabled = false; b.innerHTML = I.refresh + " Refresh from Fulfil"; }
  }
}

function bindSignIn() {
  $("#f-agency").addEventListener("submit", async e => {
    e.preventDefault();
    const id = $("#si-agency").value, code = $("#si-code").value;
    const err = $("#err-agency"), btn = $("#si-go");
    if (!normCode(code)) { err.textContent = "Enter your agency's access code."; return; }
    btn.disabled = true; err.textContent = "";
    try {
      const payload = await openVault(id, code);
      state.payload = payload;
      safeSS.set("s2w.code", { agencyId: id, code: normCode(code) });
      if ($("#si-remember").checked) safeLS.set("s2w.remember", { agencyId: id, code: normCode(code) }); else safeLS.del("s2w.remember");

    } catch (x) {
      err.textContent = x && x.message === "no-data" ? "This agency's results aren't published yet. Check back soon." : "That code doesn't match this agency. Check with your Softies sales manager.";
      btn.disabled = false;
    }
  });
}
function signIn(sess) {
  state.session = sess; safeSS.set("s2w.session", sess);
  if (sess.role === "agency") state.agencyId = sess.agencyId;
  state.wheel = { drawId: null, spinning: false, angle: 0, pending: null };
  location.hash = "my-agency"; readHash(); render(); window.scrollTo(0, 0);
  maybeAutoRefresh();
}

/* ---------- After render: animations, canvases, milestones ---------- */
function afterRender(sc) {
  requestAnimationFrame(() => document.querySelectorAll(".ribbon-fill[data-w]").forEach(el => { el.style.width = el.dataset.w + "%"; }));
  if (state.route === "cozy-credits") updateCalc();
  if (state.route === "prize-drawings") {
    const sel = drawStatus(sc.agency.id).find(d => d.id === state.wheel.drawId);
    if (sel) drawWheel(Engine.drawPool(sc.agency, sel).pool, state.wheel.angle);
  }
  if (state.route === "my-agency") {
    const a = sc.agency;
    const p = state.previewCrush === a.id ? 1 : a.pct;
    const hit = CONFIG.milestones.filter(m => p * 100 >= m).pop();
    if (hit) {
      const key = "s2w.ms." + a.id + "." + hit + (state.previewCrush === a.id ? ".preview" : "");
      if (!safeLS.get(key) || state.previewCrush === a.id) { safeLS.set(key, 1); setTimeout(() => confetti(hit === 100), 500); if (hit < 100) toast(`${a.name} hit ${hit}% of goal!`); }
    }
  }
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const jump = e.target.closest("[data-jump]");
  if (jump) { e.preventDefault(); const t = document.getElementById(jump.dataset.jump); if (t) t.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); return; }
  const el = e.target.closest("[data-action]"); if (!el) return;
  const act = el.dataset.action;
  const admin = isAdmin();
  switch (act) {
    case "signout": state.session = null; state.payload = null; safeSS.del("s2w.session"); safeSS.del("s2w.code"); safeLS.del("s2w.remember"); state.previewCrush = null; history.replaceState(null, "", location.pathname + location.search); render(); break;
    case "owner-admin": if (state.canEditPage) signIn({ role: "admin" }); break;
    case "pick-agency": if (admin) { state.agencyId = el.dataset.id; safeLS.set("s2w.view.agency", state.agencyId); state.wheel.pending = null; state.wheel.drawId = null; render(); } break;
    case "open-agency": if (admin) { state.agencyId = el.dataset.id; goRoute("my-agency"); } break;
    case "sort": state.sort = el.dataset.sort; render(); break;
    case "pick-draw": state.wheel.drawId = el.dataset.id; state.wheel.pending = null; render(); break;
    case "spin": if (admin) { if (state.wheel.pending) { state.wheel.pending = null; render(); } spin(); } break;
    case "confirm-winner": if (admin) confirmWinner(); break;
    case "void-ask": if (admin) { state.voidAsk = scope().agency.id + ":" + el.dataset.id; render(); } break;
    case "void-cancel": state.voidAsk = null; render(); break;
    case "void": if (admin) { const aid = scope().agency.id; state.draws = state.draws.filter(r => !(r.agencyId === aid && r.drawId === el.dataset.id)); state.voidAsk = null; await Store.saveDraws(); toast("Result removed."); render(); } break;
    case "csv": exportCSV(); break;
    case "copy-code": if (state.codes) { const c = state.codes[el.dataset.id]; try { await navigator.clipboard.writeText(c); toast("Code copied."); } catch (x) { toast(c); } } break;
    case "copy-email": copyEmail(true); break;
    case "copy-text": copyEmail(false); break;
    case "save-email": saveEmail(); break;
    case "map-rep": if (admin) { const s = $("#" + el.dataset.sel); if (!s.value) { toast("Choose an agency first."); return; } state.settings.repAgency[s.dataset.rep] = s.value; await Store.saveSettings(); recompute(); render(); toast("Rep mapped. Totals updated."); } break;
    case "unmap-rep": if (admin) { delete state.settings.repAgency[el.dataset.rep]; await Store.saveSettings(); recompute(); render(); } break;
    case "assign-order": if (admin) {
      const id = el.dataset.id, ag = $("#oa-" + id).value, rep = $("#or-" + id).value.trim();
      if (!ag) { toast("Choose an agency first."); return; }
      if (ag !== "np" && !rep) { toast("Add the rep's name."); return; }
      state.settings.orderAssign[id] = { agency: ag, rep: rep || "Not in competition" }; await Store.saveSettings(); recompute(); render(); toast("Order assigned. Totals updated."); } break;
    case "unassign-order": if (admin) { delete state.settings.orderAssign[el.dataset.id]; await Store.saveSettings(); recompute(); render(); } break;
    case "review": if (admin) { if (el.dataset.v) state.settings.newReview[el.dataset.cid] = el.dataset.v; else delete state.settings.newReview[el.dataset.cid]; await Store.saveSettings(); recompute(); render(); } break;
    case "refresh-fulfil": if (admin) refreshFromFulfil(); break;
    case "set-preview": if (admin) { const v = $("#preview-date").value; state.previewDate = v || null; recompute(); render(); } break;
    case "clear-preview": state.previewDate = null; recompute(); render(); break;
    case "crush": if (admin) { state.previewCrush = $("#crush-agency").value; state.agencyId = state.previewCrush; goRoute("my-agency"); } break;
    case "crush-off": state.previewCrush = null; render(); break;
    case "reset-local-ask": state.resetAsk = true; render(); break;
    case "reset-cancel": state.resetAsk = false; render(); break;
    case "reset-local": safeLS.del("s2w.local"); state.settings = { repAgency: {}, orderAssign: {}, newReview: {} }; state.draws = []; state.resetAsk = false; recompute(); render(); toast("Demo data cleared."); break;
  }
});
document.addEventListener("input", e => { if (e.target.closest(".calc")) updateCalc(); });
window.addEventListener("hashchange", () => { readHash(); state.voidAsk = null; render(); window.scrollTo(0, 0); });
let rsT; window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (state.route === "prize-drawings" && !state.wheel.spinning) { const sc = scope(); if (!sc) return; const sel = drawStatus(sc.agency.id).find(d => d.id === state.wheel.drawId); if (sel) drawWheel(Engine.drawPool(sc.agency, sel).pool, state.wheel.angle); } }, 150); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());

async function exportCSV() {
  const sc = scope(), a = sc.agency, ranked = Engine.rank(a.reps, state.sort);
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = ["Rank,Sales rep,Total sales written,% of agency goal,Qualifying orders,New accounts,Reactivated accounts,Cozy Credits"]
    .concat(ranked.map(r => [r.rank, q(r.name), r.sales.toFixed(2), (r.contribution * 100).toFixed(2), r.orders, r.newAcc, r.react, r.credits].join(","))).join("\n");
  await saveFile(`spin-to-win-${a.id}-leaderboard-${today()}.csv`, csv, "text/csv", csv);
}
async function saveFile(filename, data, type, fallbackText) {
  const dl = await cap("downloads");
  if (dl) {
    try { await dl.save({ filename, data: new Blob([data], { type }) }); return; }
    catch (e) { if (e && (e.code === "cancelled" || e.code === "declined")) return; }
  }
  try { await navigator.clipboard.writeText(fallbackText); toast("Saving files isn't available here, so it was copied to your clipboard instead."); }
  catch (e) { toast("Saving files isn't available in this view."); }
}
async function copyEmail(rich) {
  const w = weekly(scope());
  const html = emailHTML(w), text = emailText(w);
  try {
    if (rich && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })]);
    } else await navigator.clipboard.writeText(text);
    toast(rich ? "Copied with formatting. Paste into your email." : "Copied as plain text.");
  } catch (e) {
    if (rich) { try { await navigator.clipboard.writeText(text); toast("Copied as plain text (formatted copy isn't allowed here)."); return; } catch (e2) {} }
    const r = document.createRange(); const node = $("#email-preview"); r.selectNodeContents(node);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast("Copy is blocked here. The snapshot is selected; press Ctrl/Cmd+C.");
  }
}
async function saveEmail() {
  const w = weekly(scope());
  const doc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(w.a.name)} · Softies Spin to Win weekly snapshot</title></head><body style="margin:0">${emailHTML(w)}</body></html>`;
  await saveFile(`spin-to-win-${w.a.id}-weekly-${today()}.html`, doc, "text/html", emailText(w));
}

/* ---------- Boot ---------- */
async function restoreAgency() {
  let saved = safeSS.get("s2w.code");
  if (!state.session) {
    const rem = safeLS.get("s2w.remember");
    if (rem && rem.agencyId && rem.code) { saved = rem; state.session = { role: "agency", agencyId: rem.agencyId }; safeSS.set("s2w.session", state.session); }
  }
  if (!state.session || state.session.role !== "agency") return;
  try {
    if (!saved || saved.agencyId !== state.session.agencyId) throw new Error("none");
    state.payload = await openVault(saved.agencyId, saved.code);
  } catch (x) {
    state.session = null; state.payload = null; safeSS.del("s2w.session"); safeSS.del("s2w.code"); safeLS.del("s2w.remember");
  }
}

(async function boot() {
  // Website copy: the page stays the same and the locked results arrive in vault.json, refreshed twice a day.
  if (!VAULT && !window.claude) {
    try { const r = await fetch("vault.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) VAULT = await r.json(); } catch (x) {}
  }
  readHash();
  recompute();
  await restoreAgency();
  render();
  Store.init();
  cap("user").then(async u => { if (!u) return; try { state.canEditPage = !!(await u.canEdit());
    if (state.session && state.session.role === "admin" && !state.canEditPage) { state.session = null; safeSS.del("s2w.session"); }
    if (!state.session || isAdmin()) render(); maybeAutoRefresh(); } catch (e) {} });
})();

</script>
